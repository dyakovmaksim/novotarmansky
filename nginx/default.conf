# Production config for novotarmanskiyhouse.ru — HTTP→HTTPS + canonical domain redirect.
#
# First deploy (before a cert exists): comment out BOTH 443 server blocks and
# point the port-80 `location /` at the frontend (proxy_pass) so the site serves
# over plain HTTP while certbot issues the cert. Then restore this file.

# ─────────────────── HTTP (port 80) ───────────────────
# Serves ACME challenge (for renewals), redirects everything else to canonical HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name novotarmanskiyhouse.ru www.novotarmanskiyhouse.ru 138.124.126.94 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://novotarmanskiyhouse.ru$request_uri;
    }
}

# ─────────────────── HTTPS: www / bare-IP → apex ───────────────────
# Catches www and any non-canonical host (incl. the bare IP) and redirects to apex.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name www.novotarmanskiyhouse.ru 138.124.126.94 _;

    ssl_certificate     /etc/letsencrypt/live/novotarmanskiyhouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novotarmanskiyhouse.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://novotarmanskiyhouse.ru$request_uri;
}

# ─────────────────── HTTPS: canonical apex ───────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name novotarmanskiyhouse.ru;

    ssl_certificate     /etc/letsencrypt/live/novotarmanskiyhouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novotarmanskiyhouse.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers — sane defaults; tighten later if needed.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Generous upload size for the booking form (it's just JSON, but eh).
    client_max_body_size 5m;

    # ─── API → NestJS ───
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── Everything else → Nuxt ───
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Nuxt server-rendered images / HMR (HMR not in prod, but doesn't hurt).
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
